<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photoer</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
        .form-box { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
        .form-box h2 { margin-top: 0; font-size: 16px; }
        input { display: block; width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 8px; }
        button { padding: 8px 16px; cursor: pointer; }
        p.hint { color: #888; font-size: 12px; }
        p.message { font-size: 14px; min-height: 18px; }
        #statusBox { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 20px; background: #fafafa; }
        .hidden { display: none; }
    </style>
</head>

<body>
    <h1>Photoer</h1>

    <!-- 当前登录状态 -->
    <div id="statusBox">
        <strong>当前状态：</strong><span id="statusText">查询中...</span>
        <div>
            <button onclick="refreshStatus()">刷新状态</button>
            <button id="logoutBtn" onclick="handleLogout()" class="hidden">退出登录</button>
        </div>
    </div>

    <!-- 注册：第一步，提交邮箱等信息，发送验证码 -->
    <div class="form-box" id="registerStep1">
        <h2>注册（第一步）</h2>
        <input type="email" id="registerEmail" placeholder="邮箱">
        <input type="text" id="registerNickname" placeholder="昵称">
        <input type="password" id="registerPassword" placeholder="密码（至少8位）">
        <button onclick="handleRegisterStart()">获取验证码</button>
        <p class="message" id="registerStep1Message"></p>
        <p class="hint">本地开发阶段邮件是打桩的，验证码不会显示在页面上，请去运行 npm start 的终端窗口查看日志。</p>
    </div>

    <!-- 注册：第二步，输入验证码完成注册 -->
    <div class="form-box hidden" id="registerStep2">
        <h2>注册（第二步：输入验证码）</h2>
        <input type="text" id="registerCode" placeholder="6位验证码">
        <button onclick="handleRegisterVerify()">完成注册</button>
        <p class="message" id="registerStep2Message"></p>
    </div>

    <!-- 登录 -->
    <div class="form-box">
        <h2>登录</h2>
        <input type="text" id="loginAccount" placeholder="用户名或邮箱">
        <input type="password" id="loginPassword" placeholder="密码">
        <label><input type="checkbox" id="loginRemember" style="width:auto;display:inline-block"> 记住我</label>
        <button onclick="handleLogin()">登录</button>
        <p class="message" id="loginMessage"></p>
    </div>

    <script src="client.js"></script>
</body>

</html>
